name: startplatz-monitor

on:
  schedule:
    # alle 5 Minuten, versetzt zum vollen 5er-Takt (GitHub ist dort oft überlastet).
    # Cron läuft in UTC: 6-21 Uhr UTC deckt 8-22 Uhr Ortszeit in Sommer- und Winterzeit ab,
    # die genaue Grenze prüft monitor.py über WATCH_HOURS.
    - cron: "3-58/5 6-21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Testnachricht senden"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: startplatz-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Zustand wiederherstellen
        uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Prüfen
        env:
          WATCH_URL: ${{ vars.WATCH_URL }}
          WATCH_MODE: ${{ vars.WATCH_MODE }}
          WATCH_TEXT: ${{ vars.WATCH_TEXT }}
          WATCH_IGNORE: ${{ vars.WATCH_IGNORE }}
          OFFER_REGEX: ${{ vars.OFFER_REGEX }}
          NOTIFY_NOTE: ${{ vars.NOTIFY_NOTE }}
          WATCH_HOURS: ${{ vars.WATCH_HOURS }}
          WATCH_TZ: ${{ vars.WATCH_TZ }}
          ROW_INCLUDE: ${{ vars.ROW_INCLUDE }}
          ROW_EXCLUDE: ${{ vars.ROW_EXCLUDE }}
          CLICK_URL: ${{ vars.CLICK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ github.event.inputs.test }}" = "true" ]; then
            python monitor.py --test
          else
            python monitor.py
          fi
